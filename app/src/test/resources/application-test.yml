spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
  sql:
    init:
      mode: never

mybatis-plus:
  type-aliases-package: com.maintenance.entity
  configuration:
    map-underscore-to-camel-case: true
